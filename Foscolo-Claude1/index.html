<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c9a44a">
  <meta name="description" content="Percorso didattico interattivo su Ugo Foscolo: vita, poetica, opere, quiz.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Foscolo">
  <title>Ugo Foscolo — Lezione Digitale</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600;700&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;0,600;1,300;1,400;1,500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- SVG grain filter -->
  <svg style="position:absolute;width:0;height:0">
    <filter id="grain">
      <feTurbulence type="fractalNoise" baseFrequency="0.65" numOctaves="3" stitchTiles="stitch"/>
      <feColorMatrix type="saturate" values="0"/>
      <feBlend in="SourceGraphic" mode="overlay" result="blend"/>
      <feComposite in="blend" in2="SourceGraphic" operator="in"/>
    </filter>
  </svg>

  <div id="app">

    <!-- SPLASH -->
    <div id="splash">
      <div class="splash-bg">
        <img src="images/ritratto.jpg" alt="" class="splash-portrait" id="splash-portrait">
        <div class="splash-vignette"></div>
        <div class="splash-grain"></div>
      </div>
      <div class="splash-content">
        <div class="splash-ornament">✦ ✦ ✦</div>
        <div class="splash-years">MDCCLXXVIII — MDCCCXXVII</div>
        <h1 class="splash-name">
          <span class="splash-name-line">UGO</span>
          <span class="splash-name-line">FOSCOLO</span>
        </h1>
        <div class="splash-rule"></div>
        <p class="splash-subtitle">Tra Ragione e l'Eternità delle Illusioni</p>
        <button id="splash-enter" class="splash-cta">
          <span>Inizia il percorso</span>
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
        </button>
      </div>
      <div class="splash-scroll-hint">Scroll</div>
    </div>

    <!-- MAIN -->
    <div id="main" class="hidden">

      <!-- NAV -->
      <nav id="topnav">
        <div class="nav-inner">
          <button id="nav-back" class="nav-back hidden" aria-label="Torna indietro">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>
          </button>
          <button class="nav-logo" id="nav-logo">
            <span class="nav-logo-text">Foscolo</span>
          </button>
          <div class="nav-right">
            <div class="nav-progress-wrap" title="Progresso">
              <svg class="nav-ring" viewBox="0 0 36 36">
                <circle class="ring-bg" cx="18" cy="18" r="14"/>
                <circle class="ring-fill" id="ring-fill" cx="18" cy="18" r="14"/>
              </svg>
              <span id="ring-pct">0%</span>
            </div>
            <button id="menu-btn" class="hamburger" aria-label="Menu">
              <span></span><span></span><span></span>
            </button>
          </div>
        </div>
      </nav>

      <!-- DRAWER -->
      <div id="drawer">
        <div class="drawer-head">
          <span class="drawer-title">Percorso</span>
          <button id="drawer-close">✕</button>
        </div>
        <ul id="drawer-list"></ul>
      </div>
      <div id="scrim"></div>

      <!-- VIEWS -->
      <main id="content">
        <div id="view-home"></div>
        <div id="view-lesson" class="hidden"></div>
        <div id="view-quiz" class="hidden"></div>
      </main>

    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
