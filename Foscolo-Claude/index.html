<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#c4a44a">
  <meta name="description" content="Percorso didattico interattivo su Ugo Foscolo: vita, poetica, opere, quiz.">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Foscolo">
  <title>Ugo Foscolo – Lezione Digitale</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" type="image/svg+xml" href="icons/icon-192.svg">
  <link rel="apple-touch-icon" href="icons/icon-192.svg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,300;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div id="app">

    <!-- ── SPLASH ── -->
    <div id="splash">
      <div class="splash-content">
        <div class="splash-year">1778 — 1827</div>
        <h1 class="splash-title">UGO<br>FOSCOLO</h1>
        <p class="splash-subtitle">Tra Ragione e l'Eternità delle Illusioni</p>
        <button id="splash-enter" class="btn-enter">Inizia il percorso</button>
      </div>
    </div>

    <!-- ── MAIN APP ── -->
    <div id="main" class="hidden">

      <!-- Header -->
      <header id="header">
        <div class="header-inner">
          <button id="menu-toggle" class="menu-btn" aria-label="Apri menu">
            <span></span><span></span><span></span>
          </button>
          <div class="header-title">
            <span class="header-name">Foscolo</span>
          </div>
          <div class="progress-ring-container" title="Progresso completamento">
            <svg class="progress-ring" viewBox="0 0 36 36" xmlns="http://www.w3.org/2000/svg">
              <circle class="ring-bg" cx="18" cy="18" r="15"/>
              <circle class="ring-fill" id="progress-ring-fill" cx="18" cy="18" r="15"/>
            </svg>
            <span id="progress-text">0%</span>
          </div>
        </div>
      </header>

      <!-- Sidebar -->
      <nav id="sidebar" aria-label="Navigazione lezioni">
        <div class="sidebar-header">
          <span>Percorso</span>
          <button id="sidebar-close" aria-label="Chiudi menu">✕</button>
        </div>
        <ul id="nav-list" role="list"></ul>
      </nav>
      <div id="overlay" role="presentation"></div>

      <!-- Content -->
      <main id="content">
        <div id="home-view"></div>
        <div id="lesson-view" class="hidden"></div>
        <div id="quiz-view" class="hidden"></div>
      </main>

    </div><!-- /main -->
  </div><!-- /app -->

  <script src="app.js"></script>
</body>
</html>
